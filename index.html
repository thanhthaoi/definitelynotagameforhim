<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đột phá cảnh giới</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800&family=Noto+Serif:wght@800&family=Pattaya&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--panel:rgba(255,255,255,.9);--ink:#1F3B47;--gold:#8A5A00;--brush:'Pattaya','Noto Serif',serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(18,38,48,.92);--ink:#EAF6F8;--gold:#F0C75E}}
:root[data-theme="dark"]{--panel:rgba(18,38,48,.92);--ink:#EAF6F8;--gold:#F0C75E}
html,body{height:100%;margin:0}
body{background:#12201C;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#8CC85A}
.v{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.v.on{opacity:1;pointer-events:auto}
canvas{image-rendering:pixelated;display:block}
#sc{overflow:hidden;cursor:pointer;background:#C4C08A}
.kb{position:absolute;inset:0;animation:kb 26s ease-in-out infinite alternate}
.kb canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cc{animation:bb 3.2s ease-in-out infinite alternate;transition:transform 1.9s ease-in,opacity 1.9s}
#cc.wk{animation:none;transform:translateY(34%) scale(.85);opacity:0}
@keyframes kb{to{transform:scale(1.07)}}
@keyframes bb{to{transform:translateY(-1.1%)}}
.fg{position:absolute;left:-20%;right:-20%;top:55%;height:30%;background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 70%);animation:dr 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes dr{to{transform:translateX(14%)}}
#sc::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(20,10,20,.45));pointer-events:none}
#sub{position:absolute;left:16px;right:16px;bottom:20%;text-align:center;z-index:3;pointer-events:none;animation:fin .6s}
#sub b{display:block;font:800 22px/1.3 'Be Vietnam Pro',sans-serif;color:#FFD84A;text-shadow:0 2px 0 #000,0 0 6px #000;text-transform:uppercase}
#sub i{display:block;margin-top:6px;font:400 16px/1.4 'Be Vietnam Pro',sans-serif;font-style:normal;color:#EEE;text-shadow:0 1px 0 #000,0 0 5px #000}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.petal{position:absolute;top:-10px;width:6px;height:6px;z-index:2;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),calc(var(--vh,1vh)*110)) rotate(360deg)}}
#nav{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center;z-index:6;pointer-events:none}
#nav button{pointer-events:auto;min-width:46px;height:46px;border-radius:23px;border:2px solid #D9B25B;background:rgba(20,40,50,.7);color:#FFF3C4;font:800 20px/1 'Be Vietnam Pro',sans-serif;padding:0 12px;cursor:pointer}
#nav button:active{transform:scale(.92)}
#nav button:disabled{opacity:.3;cursor:default}
#nav button[hidden]{display:none}
#nt{flex:1;text-align:center;font:800 12px 'Be Vietnam Pro',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000}
#nav #sk{font-size:14px}
.gt{background:linear-gradient(180deg,#FFF3B0,#F0B73A 55%,#B8741A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(1px 0 0 #6B3A0A) drop-shadow(-1px 0 0 #6B3A0A) drop-shadow(0 1px 0 #6B3A0A) drop-shadow(0 -1px 0 #6B3A0A) drop-shadow(0 0 8px rgba(255,220,120,.7))}
#wd,#mg{width:100%;height:100%;object-fit:contain;touch-action:none}
#wv{background:#8CC85A}#lv{background:#1E2B26}
#hud{position:absolute;top:64px;left:12px;right:12px;pointer-events:none;font:800 12px 'Be Vietnam Pro',sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
#hb{height:8px;border:2px solid #2B1F10;background:rgba(0,0,0,.4);margin-top:4px;border-radius:6px;overflow:hidden}
#hb i{display:block;height:100%;background:linear-gradient(90deg,#F7D774,#E0A12E);transition:width .8s}
.bt{min-height:48px;border:2px solid #9C6A12;border-radius:999px;background:linear-gradient(180deg,#F7D774,#E0A12E);color:#4A2A00;font:800 16px 'Be Vietnam Pro',sans-serif;cursor:pointer;box-shadow:0 3px 0 #9C6A12}
.bt:active{transform:translateY(2px);box-shadow:0 1px 0 #9C6A12}
.bt:disabled{opacity:.6}
#pn{position:absolute;inset:0;display:flex;flex-direction:column;padding:62px 12px 14px;box-sizing:border-box;pointer-events:none;gap:10px}
#pn>*{pointer-events:auto}
.ob{background:rgba(16,22,30,.72);color:#F2EAD6;border:0;border-left:3px solid #D9B25B;border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;pointer-events:none!important}
.ob b{display:block;font:800 14px 'Noto Serif',serif;color:#F7D774}
.ct{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ct p{margin:0;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
.ct .bt{background:var(--panel);color:var(--ink)}
.dp{text-align:center;font:800 28px 'Be Vietnam Pro',sans-serif;letter-spacing:8px;color:#FFF3C4;text-shadow:0 2px 3px #000}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto;width:100%}
.pad button{min-height:48px;border:2px solid #D9B25B;border-radius:12px;background:var(--panel);color:var(--ink);font:800 18px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.cd{margin:auto;width:100%;box-sizing:border-box;background:var(--panel);color:var(--ink);border:2px solid #D9B25B;border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 0 0 4px rgba(217,178,91,.25);animation:rise .7s}
.cd small{font:800 12px 'Be Vietnam Pro',sans-serif;letter-spacing:3px;color:var(--gold)}
.cd h2{margin:0;font:800 28px/1.25 'Noto Serif',serif}
.cd hr{border:0;height:2px;width:60%;margin:0 auto;background:linear-gradient(90deg,transparent,#D9B25B,transparent)}
.cd p{margin:0;font-size:16px;line-height:1.7;white-space:pre-line}
.cd .pt{font-style:italic;color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:4;pointer-events:none}
#ov>*{pointer-events:auto}
#ov p{margin:0;color:#fff;font-size:15px;text-shadow:0 1px 3px #000,0 0 6px #000;text-align:center;padding:0 20px}
.orb{width:84px;height:84px;border-radius:50%;border:0;background:radial-gradient(circle,#fff,#F7D774 45%,rgba(247,215,116,0) 72%);animation:pu 1.8s ease-in-out infinite;cursor:pointer}
@keyframes pu{50%{transform:scale(1.25);filter:brightness(1.2)}}
.fl{position:relative;width:150px;height:110px}
.fl::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#F7D774;border:2px solid #B8741A}
.fl button{position:absolute;left:50%;top:50%;width:26px;height:50px;margin:-50px 0 0 -13px;border:0;padding:0;border-radius:50%/70% 70% 30% 30%;background:linear-gradient(#F7B8CF,#DE5C8E);transform-origin:50% 100%;transform:rotate(calc(var(--r)*1deg));animation:bl 1.2s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--r)*3ms);cursor:pointer}
@keyframes bl{from{transform:rotate(calc(var(--r)*1deg)) scale(0)}}
#ld{overflow-y:auto;background:#2B2118;color:#F4E8D0;padding:76px 26px 48px;box-sizing:border-box;text-align:center}
.lp{opacity:0;animation:lf 1.4s forwards;font-size:17px;line-height:1.9;margin:0 0 18px}
h2.lp{font:800 26px/1.3 'Noto Serif',serif}
@keyframes lf{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.petal{display:none}.lp{opacity:1}}
#nav{gap:4px}#nav button{min-width:40px;height:42px;padding:0 9px;font-size:16px}#nav #sk,#nav #nb{font-size:13px}
#vol{pointer-events:auto;width:56px;flex:none;accent-color:#F0B73A}
#volbox{display:flex;align-items:center;pointer-events:auto}
#volbox .vmute{display:none;pointer-events:auto}
#nt{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media(max-width:700px){
#nav{flex-wrap:wrap;align-items:flex-start;row-gap:4px}
#nav button{box-sizing:border-box;min-width:34px;height:38px;padding:0 6px;font-size:15px}
#nav #bk,#nav #mu,#nav #rs,#nav #fw{width:34px}
#nav #nb{min-width:54px;font-size:12px}
#nav #sk{min-width:42px;font-size:12px}
#nt{order:10;flex:1 0 100%;box-sizing:border-box;min-height:22px;padding:4px 8px;border-radius:6px;background:rgba(20,40,50,.78);font-size:11px;line-height:1.3;letter-spacing:1px;white-space:normal;overflow:visible;text-overflow:clip}
#volbox{display:none;position:absolute;top:43px;right:0;z-index:20;width:170px;max-width:calc(100vw - 20px);padding:10px 12px;box-sizing:border-box;flex-direction:column;align-items:stretch;gap:8px;border:1px solid #D9B25B;border-radius:10px;background:rgba(20,40,50,.96);box-shadow:0 6px 20px rgba(0,0,0,.4)}
#nav.vol-open #volbox{display:flex}
#vol{width:100%;height:28px;box-sizing:border-box}
#volbox .vmute{display:block;width:100%;height:36px;border:1px solid #D9B25B;border-radius:8px;background:rgba(255,255,255,.1);color:#FFF3C4;font:700 13px 'Be Vietnam Pro',sans-serif}
#pn{padding:90px 10px 12px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#pn>.cd{box-sizing:border-box;max-height:100%;min-height:0;overflow-y:auto;touch-action:pan-y}
#sub{left:12px;right:12px;bottom:calc(14% + env(safe-area-inset-bottom,0px))}
#sub b{font-size:20px}
#sub i{font-size:14px}
}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center}.dpad button{width:64px;height:52px;border:2px solid #D9B25B;border-radius:12px;background:var(--panel);color:var(--ink);font:800 20px 'Be Vietnam Pro',sans-serif;cursor:pointer;touch-action:manipulation}.dpad button:nth-child(1){grid-column:2;grid-row:1}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:3;grid-row:2}.dpad button:nth-child(4){grid-column:2;grid-row:2}
.bar{display:flex;gap:8px}.bar button{flex:1;min-height:44px;border:2px solid #D9B25B;border-radius:12px;background:var(--panel);color:var(--ink);font:800 14px 'Be Vietnam Pro',sans-serif;cursor:pointer}
#pn .cd .bt+.bt{margin-top:-2px}
.gb{border:0;background:radial-gradient(circle,rgba(255,243,176,.9),rgba(255,243,176,0) 70%);padding:16px;animation:pu 2s ease-in-out infinite;cursor:pointer}.gb canvas{width:96px;height:96px;image-rendering:pixelated;display:block}
#sc .kb{transition:filter 2s}#sc.warm .kb{filter:sepia(.55) saturate(1.5) brightness(1.08)}
.skf{position:absolute;right:10px;bottom:118px;width:58px;height:58px;z-index:9;border:0;background:none;padding:0;cursor:pointer;z-index:4;animation:pu 3s ease-in-out infinite}
.skf i{position:absolute;left:50%;top:50%;width:17px;height:26px;margin:-26px 0 0 -8px;border-radius:50%/70% 70% 30% 30%;background:linear-gradient(#FBD0E0,#F08AB0);transform-origin:50% 100%;box-shadow:0 0 6px rgba(240,138,176,.6)}
.skf i:nth-child(1){transform:rotate(0deg)}.skf i:nth-child(2){transform:rotate(72deg)}.skf i:nth-child(3){transform:rotate(144deg)}.skf i:nth-child(4){transform:rotate(216deg)}.skf i:nth-child(5){transform:rotate(288deg)}
.skf b{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-7px;border-radius:50%;background:#F7D774;border:2px solid #B8741A}
.skf u{position:absolute;right:0;bottom:-6px;font:800 10px 'Be Vietnam Pro',sans-serif;text-decoration:none;color:#FFF3C4;text-shadow:0 1px 3px #000;opacity:0;transition:.2s;white-space:nowrap}
.skf:hover u,.skf:focus u{opacity:1}

/* ===== Bản đồ: HUD tu tiên ===== */
.onmap #nav{display:none}
.ink{text-shadow:0 1px 0 #1A0E14,1px 0 0 #1A0E14,-1px 0 0 #1A0E14,0 -1px 0 #1A0E14,0 2px 4px rgba(0,0,0,.6)}
#mhud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.avw{position:relative;flex:none}
.ava{width:62px;height:62px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#FFF1D0,#D9AE6A 68%,#8A5A22);border:3px solid #241820;box-shadow:0 0 0 2px #E2B85A,0 4px 10px rgba(0,0,0,.45)}
.ava canvas{width:100%;height:100%;image-rendering:pixelated}
.alv{position:absolute;left:-5px;top:-5px;min-width:24px;height:24px;padding:0 4px;box-sizing:border-box;border-radius:12px;background:#1C1418;color:#FFE9A0;font:800 12px/21px 'Be Vietnam Pro',sans-serif;text-align:center;border:1.5px solid #E2B85A}
.rlm{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;padding:1px 8px 2px;border-radius:4px;background:linear-gradient(#A8261C,#6E140E);border:1px solid #E2B85A;color:#FFF3C4;font:400 12px/1.2 var(--brush)}
.mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-top:2px}
.r1{display:flex;gap:5px;align-items:center}
.nm,.cur{background:rgba(26,18,24,.84);border:1px solid rgba(226,184,90,.55);border-radius:999px;color:#F6EEDC;font:800 12px 'Be Vietnam Pro',sans-serif}
.nm{flex:1;min-width:0;padding:3px 10px 5px}
.nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;letter-spacing:1px}
.nm i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:3px}
.nm u{display:block;height:100%;width:0;background:linear-gradient(90deg,#B6E36B,#3FB5A5);transition:width .8s}
.cur{flex:none;display:flex;align-items:center;gap:4px;padding:2px 9px 2px 2px;white-space:nowrap}
.cur canvas{width:22px;height:22px;image-rendering:pixelated}
.pw{align-self:flex-start;display:flex;align-items:baseline;gap:6px;padding:4px 30px 5px 12px;background:linear-gradient(90deg,rgba(26,18,24,.9) 65%,rgba(26,18,24,0));border-left:3px solid #E2B85A}
.pw em{font:400 13px var(--brush);font-style:normal;color:#E8D3A0}
.pw b{font:400 21px/1 var(--brush)}
#lbl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbt{position:absolute;transform:translate(-50%,-50%);isolation:isolate;pointer-events:auto;cursor:pointer;border:0;border-radius:3px;padding:3px 12px 4px;background:linear-gradient(180deg,#3E2C36,#1C1418);box-shadow:inset 0 0 0 1px rgba(226,184,90,.6);color:#FFF6E0;font:400 clamp(12px,3.6vw,16px)/1.15 var(--brush);white-space:nowrap}
.lbt::before,.lbt::after{content:"";position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;background:#2A1E26;box-shadow:inset 0 0 0 1px rgba(226,184,90,.6);transform:rotate(45deg);z-index:-1}
.lbt::before{left:-5px}.lbt::after{right:-5px}
.lbt span{text-shadow:0 1px 0 #000,0 0 4px #000}
.lbt .dot{position:absolute;top:-5px;right:-7px;width:10px;height:10px;border-radius:50%;background:#E0302A;border:1.5px solid #FFF3C4;display:none}
.lbt.now .dot{display:block}
.lbt.now{box-shadow:inset 0 0 0 1px #F7D774,0 0 10px rgba(247,215,116,.6)}
.lbt.done span{color:#F7D774}.lbt.done span::before{content:'✓ ';font-family:'Be Vietnam Pro',sans-serif;font-weight:800}
.lbt.lock{color:#B8AFA6;background:linear-gradient(180deg,#3A363C,#222024)}
.lbt:focus-visible,.mb:focus-visible,#en:focus-visible,.bk:focus-visible,.coin:focus-visible{outline:2px solid #FFF3C4;outline-offset:2px}
#mbar{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:flex-end;justify-content:space-around;padding:0 4px 6px;box-sizing:border-box;z-index:3;background:linear-gradient(180deg,rgba(28,20,24,0) 0,rgba(28,20,24,.9) 30px,#17101A 100%)}
#mbar::before{content:"";position:absolute;left:0;right:0;top:22px;height:12px;background:radial-gradient(circle at 12px 12px,#2E2028 9px,transparent 10px) 0 0/24px 12px repeat-x}
#mbar::after{content:"";position:absolute;left:0;right:0;top:33px;height:2px;background:linear-gradient(90deg,transparent,#E2B85A 20%,#F7D774 50%,#E2B85A 80%,transparent)}
.mb{position:relative;z-index:1;width:64px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:#FFF6E0;font:400 14px/1.1 var(--brush)}
.mb canvas{width:32px;height:32px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 #000)}
.mb.off canvas{opacity:.35}.mb.lock canvas{filter:grayscale(1) brightness(.7)}
.mb:active,#en:active{transform:translateY(2px)}
#en{position:relative;z-index:2;align-self:flex-end;width:92px;margin-bottom:-2px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#FFF6E0}
#en .ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 42% 35%,#FFF3B0,#F0B73A 52%,#9A5A12);border:3px solid #2A1414;box-shadow:0 0 0 2px #F7D774,0 0 16px rgba(255,220,120,.5)}
#en .ring canvas{width:32px;height:32px;image-rendering:pixelated}
#en.go .ring{animation:gl 1.6s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 0 2px #F7D774,0 0 26px rgba(255,230,140,.95)}}
#en:disabled{cursor:default}#en:disabled .ring{filter:grayscale(1) brightness(.7)}
#ent{font:400 17px/1.1 var(--brush);margin-top:2px}
#ens{font:700 10px/1.2 'Be Vietnam Pro',sans-serif;color:#E8D8B8;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mo{position:absolute;inset:0;z-index:5;display:none;padding:20px;box-sizing:border-box;background:rgba(14,8,26,.6)}
#mo.on{display:flex}
.bt.ghost{background:transparent;box-shadow:none;border-color:#B89A5A;color:var(--ink)}
/* ===== Túi đồ: sạp pháp bảo ===== */
#bag{z-index:7;background:#F3EAD6;overflow-y:auto;padding:0 0 24px;box-sizing:border-box;color:#3A2A20}
.bh{position:relative;min-height:236px;padding:66px 18px 40px;box-sizing:border-box;overflow:visible;background:radial-gradient(ellipse 60% 22% at 12% 72%,rgba(232,214,240,.55),transparent 70%),radial-gradient(ellipse 50% 14% at 88% 30%,rgba(232,214,240,.4),transparent 70%),radial-gradient(ellipse 80% 30% at 30% 40%,rgba(120,90,160,.5),transparent 70%),linear-gradient(170deg,#3E2A5C,#5E4280 55%,#7A5A96)}
.bh::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:44px;background:#F3EAD6;border-radius:50% 50% 0 0/100% 100% 0 0}
.bh::before{content:"";position:absolute;left:0;right:0;bottom:30px;height:16px;background:linear-gradient(90deg,transparent,#F2C860 30%,#E09A30 70%,transparent);border-radius:50%;opacity:.7;transform:rotate(-3deg)}
.bct{position:absolute;top:18px;left:16px;display:flex;align-items:center;gap:6px;padding:2px 16px 2px 2px;border-radius:999px;background:rgba(26,18,34,.6);color:#E8E0F0;font:800 14px 'Be Vietnam Pro',sans-serif}
.bct canvas{width:26px;height:26px;image-rendering:pixelated}
.bt1,.bt2{position:relative;z-index:1;margin:0;color:#FFFDF6;font:400 34px/1.15 var(--brush);text-shadow:0 2px 0 #2A1840,2px 0 0 #2A1840,-2px 0 0 #2A1840,0 -2px 0 #2A1840,2px 2px 0 #2A1840,-2px 2px 0 #2A1840,0 6px 10px rgba(20,10,40,.5)}
.bt2{padding-left:44px;font-size:30px}
.btm{position:relative;z-index:1;margin:12px 0 0;color:#F4ECDC;font:600 13px 'Be Vietnam Pro',sans-serif;text-shadow:0 1px 2px #2A1840}
.bpile{position:absolute;right:6px;bottom:52px;width:132px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 6px 8px rgba(20,10,40,.45))}
.btabs{position:absolute;right:10px;bottom:-16px;z-index:2;display:flex;gap:6px}
